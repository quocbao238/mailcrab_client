name: Release

# Push a semver tag to build Android, Linux and Windows and publish a GitHub
# Release:
#   git tag v1.2.3 && git push --tags
# Manual runs (workflow_dispatch) build artifacts without publishing.
#
# macOS is built on a Mac instead, so the DMG can be signed with a Developer ID
# identity and notarised; a hosted runner has no access to those credentials.
# Attach it to the release afterwards:
#   gh release upload v1.2.3 MailCrab-macos.dmg

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  android:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk \
             MailCrab-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MailCrab-android.apk

  linux:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - name: Build Linux bundle
        run: |
          flutter build linux --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ github.run_number }}
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/MailCrab-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: MailCrab-linux-x64.tar.gz

  windows:
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows bundle
        run: |
          flutter build windows --release --build-name=${{ needs.prepare.outputs.version }} --build-number=${{ github.run_number }}
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "MailCrab-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MailCrab-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist/*
