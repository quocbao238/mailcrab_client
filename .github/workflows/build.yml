name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - name: Package tarball
        run: |
          cd build/linux/x64/release/bundle
          tar czf ../../../../../MailCrab-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: MailCrab-linux-x64
          path: MailCrab-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Package zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MailCrab-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MailCrab-windows-x64
          path: MailCrab-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build macos --release
      - name: Package DMG
        run: |
          mkdir dmg_stage
          cp -R build/macos/Build/Products/Release/MailCrab.app dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "MailCrab" -srcfolder dmg_stage -ov -format UDZO MailCrab-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MailCrab-macos
          path: MailCrab-macos.dmg
